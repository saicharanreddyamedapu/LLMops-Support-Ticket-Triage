name: ticket-triage
services:
  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unavailable}
    ports: ["127.0.0.1:8765:8000"]
    environment:
      TRIAGE_MODE: ${TRIAGE_MODE:-fixture}
      TRIAGE_KEYS: ${TRIAGE_KEYS:-fixture-demo}
      CLIENT_RPS: ${CLIENT_RPS:-12}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LIVE_BUDGET_USD: ${LIVE_BUDGET_USD:-0}
      RECORD_REPLAY: ${RECORD_REPLAY:-0}
      FIXTURE_FAULT_FILE: /service/config/fixture-fault.json
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://collector:4318/v1/traces
    volumes: ["./config:/service/config:ro", "state:/service/state"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 15
  phoenix:
    image: arizephoenix/phoenix:version-11.34.0
    ports: ["127.0.0.1:16006:6006"]
    volumes: ["traces:/mnt/data"]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
  collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/collector.yaml"]
    ports: ["127.0.0.1:14318:4318"]
    environment:
      TRIAGE_METRICS_TARGET: ${TRIAGE_METRICS_TARGET:-api:8000}
    volumes: ["./ops/collector.yaml:/etc/collector.yaml:ro"]
  prometheus:
    image: prom/prometheus:v3.6.0
    volumes: ["./ops/prometheus.yaml:/etc/prometheus/prometheus.yml:ro","./ops/alerts.yaml:/etc/prometheus/alerts.yaml:ro"]
    ports: ["127.0.0.1:19090:9090"]
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
    volumes: ["./ops/grafana/provisioning:/etc/grafana/provisioning:ro", "./ops/grafana/triage.json:/var/lib/grafana/dashboards/triage.json:ro"]
    ports: ["127.0.0.1:13000:3000"]
volumes:
  state:
  traces:
