[project]
name = "ticket-triage"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
 "litellm>=1.75,<2", "PyYAML>=6,<7", "prometheus-client>=0.21,<1",
 "opentelemetry-sdk>=1.33,<2", "opentelemetry-exporter-otlp-proto-http>=1.33,<2",
 "tiktoken>=0.9,<1", "httpx>=0.28,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]
[tool.uv]
package = false
